<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>Losowe opisy</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; background: #f5f3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: clamp(72px, 12vh, 140px) 0 80px; }
    h1 { font-size: clamp(36px, 7vw, 58px); letter-spacing: -.055em; line-height: 1; margin: 0 0 14px; }
    .intro { color: #666; margin: 0 0 54px; line-height: 1.5; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-top: 1px solid #d8d4cb; padding: 24px 0; }
    .row:last-of-type { border-bottom: 1px solid #d8d4cb; }
    .name { font-size: clamp(19px, 4vw, 25px); font-weight: 650; letter-spacing: -.025em; }
    .count { display: block; color: #777; font-size: 13px; font-weight: 400; letter-spacing: 0; margin-top: 5px; }
    button { background: #222; border: 1px solid #222; border-radius: 9px; color: white; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 10px 20px; transition: background .15s, transform .15s; }
    button:hover { background: #444; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #9a8a69; outline-offset: 3px; }
    #status { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); max-height: 50vh; overflow: auto; margin: 0; padding: 18px 20px; border-radius: 12px; background: #222; color: white; box-shadow: 0 12px 36px #0003; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; z-index: 1; }
    #status:empty { display: none; }
    @media (max-width: 460px) { .row { gap: 12px; } button { padding-inline: 15px; } }
  </style>
</head>
<body>
  <main>
    <h1>Losowe opisy</h1>
    <p class="intro">Wybierz kategorię i skopiuj jeden losowy opis.</p>
    <div id="categories"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="./data.js"></script>
  <script>
    const container = document.querySelector('#categories');
    const status = document.querySelector('#status');
    let lastIndex = {};
    let statusTimeout;
    function showStatus(text) {
      clearTimeout(statusTimeout);
      status.textContent = text;
      statusTimeout = setTimeout(() => { status.textContent = ''; }, 3000);
    }
    function copyFallback(text) {
      const field = document.createElement('textarea');
      field.value = text;
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.append(field);
      field.select();
      const copied = document.execCommand('copy');
      field.remove();
      if (!copied) throw new Error('Clipboard unavailable');
    }

    for (const [category, descriptions] of Object.entries(window.DESCRIPTIONS)) {
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('div');
      label.className = 'name';
      label.textContent = category;
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = `${descriptions.length} opisów`;
      label.append(count);
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Kopiuj';
      button.setAttribute('aria-label', `Kopiuj losowy opis: ${category}`);
      button.addEventListener('click', async () => {
        let index = Math.floor(Math.random() * descriptions.length);
        if (descriptions.length > 1 && index === lastIndex[category]) {
          index = (index + 1 + Math.floor(Math.random() * (descriptions.length - 1))) % descriptions.length;
        }
        try {
          if (navigator.clipboard?.writeText) {
            await Promise.race([
              navigator.clipboard.writeText(descriptions[index]),
              new Promise((_, reject) => setTimeout(() => reject(new Error('Clipboard timeout')), 800))
            ]).catch(() => copyFallback(descriptions[index]));
          } else {
            copyFallback(descriptions[index]);
          }
          lastIndex[category] = index;
          showStatus(descriptions[index]);
          button.textContent = 'Skopiowano';
          setTimeout(() => { button.textContent = 'Kopiuj'; }, 1600);
        } catch {
          showStatus('Nie udało się skopiować. Spróbuj ponownie w przeglądarce.');
        }
      });
      row.append(label, button);
      container.append(row);
    }
  </script>
</body>
</html>
